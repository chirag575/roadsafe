name: roadsafe_ai
description: RoadSafe AI - Pothole and Blind Spot Detection System
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  camera: ^0.11.0+2
  tflite_flutter: ^0.11.0
  geolocator: ^14.0.2
  sensors_plus: ^6.1.1
  flutter_local_notifications: ^19.5.0

  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0

  google_maps_flutter: ^2.10.1
  url_launcher: ^6.3.1

  image_picker: ^1.1.2
  path_provider: ^2.0.15
  permission_handler: ^12.0.3

  provider: ^6.1.5
  http: ^1.5.0
  json_annotation: ^4.9.0

  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  json_serializable: ^6.6.0
  build_runner: ^2.4.5

  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  geolocator_android: 4.6.1
  package_info_plus: 8.3.1

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/icon/
    - models/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/roadsafe_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/roadsafe_icon.png"
plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.roadsafe.ai.program2"
    compileSdk = 35
    ndkVersion = "27.3.13750724"

    defaultConfig {
        applicationId = "com.roadsafe.ai.program2"
        minSdk = 23
        targetSdk = 35
        versionCode = 1
        versionName = "1.0.0"

        manifestPlaceholders = [
            MAPS_API_KEY: project.findProperty('MAPS_API_KEY') ?: "REPLACE_WITH_ANDROID_MAPS_API_KEY",
            applicationName: "android.app.Application"
        ]
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfigs {
                    release {
                        keyAlias keystoreProperties['keyAlias']
                        keyPassword keystoreProperties['keyPassword']
                        storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                        storePassword keystoreProperties['storePassword']
                    }
                }
                signingConfig = signingConfigs.release
            } else {
                // Local builds remain possible until a production keystore is configured.
                signingConfig = signingConfigs.debug
            }
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}